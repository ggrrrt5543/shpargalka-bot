<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — Шпаргалка</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- KaTeX для рендера формул -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container solution-page">
        <header class="solution-header">
            <div class="logo">📚 Шпаргалка</div>
            <h1 class="solution-title">{{ title }}</h1>
        </header>

        <main class="solution-content" id="content">
            {{ content | safe }}
        </main>

        <footer class="solution-footer">
            <p>✏️ Проверяй ответы самостоятельно</p>
        </footer>
    </div>

    <script>
        // Инициализация Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        // Парсинг markdown-подобного контента
        document.addEventListener('DOMContentLoaded', function() {
            const content = document.getElementById('content');
            let html = content.innerHTML;

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function niceStep(span) {
                const target = span / 8;
                if (!isFinite(target) || target <= 0) return 1;
                const mag = Math.pow(10, Math.floor(Math.log10(target)));
                for (const k of [1, 2, 2.5, 5, 10]) {
                    const step = k * mag;
                    if (step >= target) return step;
                }
                return mag * 10;
            }

            function parseEquationExpression(equation) {
                const raw = String(equation || '').trim();
                const expr = raw.includes('=') ? raw.split('=').slice(1).join('=') : raw;
                return expr
                    .replace(/\^/g, '**')
                    .replace(/π/g, 'Math.PI')
                    .replace(/\be\b/g, 'Math.E')
                    .replace(/\bsin\b/g, 'Math.sin')
                    .replace(/\bcos\b/g, 'Math.cos')
                    .replace(/\btan\b/g, 'Math.tan')
                    .replace(/\basin\b|\barcsin\b/g, 'Math.asin')
                    .replace(/\bacos\b|\barccos\b/g, 'Math.acos')
                    .replace(/\batan\b|\barctan\b/g, 'Math.atan')
                    .replace(/\bln\b/g, 'Math.log')
                    .replace(/\blog10\b/g, 'Math.log10')
                    .replace(/\blog\b/g, 'Math.log')
                    .replace(/\bsqrt\b/g, 'Math.sqrt')
                    .replace(/\babs\b/g, 'Math.abs')
                    .replace(/(\d)\s*x/g, '$1*x')
                    .replace(/x\s*(\d)/g, 'x*$1');
            }

            function evaluateExpression(expression, x) {
                if (!/^[0-9xX+\-*/().,\s_MathPIEacosinlrtgbqepw]+$/.test(expression)) {
                    return NaN;
                }
                try {
                    return Function('x', `"use strict"; return (${expression});`)(x);
                } catch (e) {
                    return NaN;
                }
            }

            function renderVisualization(spec) {
                const cs = spec.coordinate_system || {};
                const objects = Array.isArray(spec.objects) ? spec.objects : [];
                const xRange = Array.isArray(cs.x_range) ? cs.x_range : [-10, 10];
                const yRange = Array.isArray(cs.y_range) ? cs.y_range : [-10, 10];
                const xMin = Number(xRange[0]);
                const xMax = Number(xRange[1]);
                const yMin = Number(yRange[0]);
                const yMax = Number(yRange[1]);
                if (![xMin, xMax, yMin, yMax].every(Number.isFinite) || xMin >= xMax || yMin >= yMax) {
                    return `<pre class="visualization-error">Некорректная система координат</pre>`;
                }

                if (spec.type === '3d') {
                    return `<div class="visualization-block"><div class="visualization-title">${escapeHtml(spec.title || '3D visualization')}</div><pre class="visualization-json">${escapeHtml(JSON.stringify(spec, null, 2))}</pre></div>`;
                }

                const W = 720;
                const H = 460;
                const L = 58;
                const R = 24;
                const T = 34;
                const B = 48;
                const plotW = W - L - R;
                const plotH = H - T - B;
                const sx = x => L + (x - xMin) / (xMax - xMin) * plotW;
                const sy = y => T + (yMax - y) / (yMax - yMin) * plotH;
                const parts = [];

                parts.push(`<div class="visualization-block">`);
                if (spec.title) {
                    parts.push(`<div class="visualization-title">${escapeHtml(spec.title)}</div>`);
                }
                parts.push(`<svg class="math-visualization" viewBox="0 0 ${W} ${H}" role="img">`);
                parts.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`);
                parts.push(`<rect x="${L}" y="${T}" width="${plotW}" height="${plotH}" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>`);

                if (cs.show_grid !== false) {
                    const stepX = niceStep(xMax - xMin);
                    const stepY = niceStep(yMax - yMin);
                    for (let gx = Math.ceil(xMin / stepX) * stepX; gx <= xMax + 1e-9; gx += stepX) {
                        const X = sx(gx);
                        parts.push(`<line class="grid" x1="${X.toFixed(2)}" y1="${T}" x2="${X.toFixed(2)}" y2="${T + plotH}"/>`);
                        if (Math.abs(gx) > 1e-9) {
                            parts.push(`<text class="tick-label" x="${X.toFixed(2)}" y="${T + plotH + 18}" text-anchor="middle">${Number(gx.toPrecision(4))}</text>`);
                        }
                    }
                    for (let gy = Math.ceil(yMin / stepY) * stepY; gy <= yMax + 1e-9; gy += stepY) {
                        const Y = sy(gy);
                        parts.push(`<line class="grid" x1="${L}" y1="${Y.toFixed(2)}" x2="${L + plotW}" y2="${Y.toFixed(2)}"/>`);
                        if (Math.abs(gy) > 1e-9) {
                            parts.push(`<text class="tick-label" x="${L - 8}" y="${(Y + 4).toFixed(2)}" text-anchor="end">${Number(gy.toPrecision(4))}</text>`);
                        }
                    }
                }

                if (cs.show_axes !== false) {
                    if (xMin <= 0 && xMax >= 0) {
                        const X0 = sx(0);
                        parts.push(`<line class="axis" x1="${X0.toFixed(2)}" y1="${T}" x2="${X0.toFixed(2)}" y2="${T + plotH}"/>`);
                    }
                    if (yMin <= 0 && yMax >= 0) {
                        const Y0 = sy(0);
                        parts.push(`<line class="axis" x1="${L}" y1="${Y0.toFixed(2)}" x2="${L + plotW}" y2="${Y0.toFixed(2)}"/>`);
                    }
                    parts.push(`<text class="axis-label" x="${L + plotW - 4}" y="${T + plotH - 8}" text-anchor="end">x</text>`);
                    parts.push(`<text class="axis-label" x="${L + 10}" y="${T + 16}">y</text>`);
                }

                for (const obj of objects) {
                    if (!obj || typeof obj !== 'object') continue;
                    if (obj.type === 'line' && Array.isArray(obj.from) && Array.isArray(obj.to)) {
                        parts.push(`<line class="math-line" x1="${sx(Number(obj.from[0])).toFixed(2)}" y1="${sy(Number(obj.from[1])).toFixed(2)}" x2="${sx(Number(obj.to[0])).toFixed(2)}" y2="${sy(Number(obj.to[1])).toFixed(2)}"/>`);
                    } else if (obj.type === 'circle' && Array.isArray(obj.center)) {
                        const cx = Number(obj.center[0]);
                        const cy = Number(obj.center[1]);
                        const rx = Math.abs(sx(cx + Number(obj.radius)) - sx(cx));
                        const ry = Math.abs(sy(cy + Number(obj.radius)) - sy(cy));
                        parts.push(`<ellipse class="math-circle" cx="${sx(cx).toFixed(2)}" cy="${sy(cy).toFixed(2)}" rx="${rx.toFixed(2)}" ry="${ry.toFixed(2)}"/>`);
                    } else if (obj.type === 'function') {
                        const expression = parseEquationExpression(obj.equation);
                        const domain = Array.isArray(obj.domain) ? obj.domain : [xMin, xMax];
                        const a = Math.max(xMin, Number(domain[0]));
                        const b = Math.min(xMax, Number(domain[1]));
                        const segments = [];
                        let current = [];
                        const n = 900;
                        for (let i = 0; i <= n; i++) {
                            const x = a + (b - a) * i / n;
                            const y = evaluateExpression(expression, x);
                            if (!Number.isFinite(y) || y < yMin - (yMax - yMin) || y > yMax + (yMax - yMin)) {
                                if (current.length) {
                                    segments.push(current);
                                    current = [];
                                }
                                continue;
                            }
                            const point = `${current.length ? 'L' : 'M'}${sx(x).toFixed(2)},${sy(y).toFixed(2)}`;
                            current.push(point);
                        }
                        if (current.length) segments.push(current);
                        for (const segment of segments) {
                            parts.push(`<path class="function-curve" d="${segment.join(' ')}"/>`);
                        }
                        if (obj.equation) {
                            parts.push(`<text class="function-label" x="${L + plotW - 8}" y="${T + 22}">${escapeHtml(obj.equation)}</text>`);
                        }
                        if (Array.isArray(obj.important_points)) {
                            for (const p of obj.important_points) {
                                if (Number.isFinite(Number(p.x)) && Number.isFinite(Number(p.y))) {
                                    parts.push(`<circle class="math-point important" cx="${sx(Number(p.x)).toFixed(2)}" cy="${sy(Number(p.y)).toFixed(2)}" r="4"/>`);
                                    if (p.label) {
                                        parts.push(`<text class="point-label" x="${(sx(Number(p.x)) + 7).toFixed(2)}" y="${(sy(Number(p.y)) - 7).toFixed(2)}">${escapeHtml(p.label)}</text>`);
                                    }
                                }
                            }
                        }
                    }
                }

                for (const obj of objects) {
                    if (obj && obj.type === 'point' && Number.isFinite(Number(obj.x)) && Number.isFinite(Number(obj.y))) {
                        parts.push(`<circle class="math-point" cx="${sx(Number(obj.x)).toFixed(2)}" cy="${sy(Number(obj.y)).toFixed(2)}" r="4"/>`);
                        if (obj.label) {
                            parts.push(`<text class="point-label" x="${(sx(Number(obj.x)) + 7).toFixed(2)}" y="${(sy(Number(obj.y)) - 7).toFixed(2)}">${escapeHtml(obj.label)}</text>`);
                        }
                    }
                }

                parts.push(`</svg>`);
                parts.push(`</div>`);
                return parts.join('');
            }

            // Обработка блоков ```visualization\n{...}\n```
            html = html.replace(/```visualization\n([\s\S]*?)```/g, function(match, jsonText) {
                try {
                    return renderVisualization(JSON.parse(jsonText.trim()));
                } catch (e) {
                    return `<pre class="visualization-error">${escapeHtml(jsonText.trim())}</pre>`;
                }
            });

            // Обработка блоков ```formula:подпись\n...\n```
            html = html.replace(/```formula:?(.*?)\n([\s\S]*?)```/g, function(match, label, formula) {
                const trimmed = formula.trim();
                const labelHtml = label ? `<div class="formula-label">${label.trim()}</div>` : '';
                return `<div class="formula-block">${labelHtml}<div class="formula-content">${trimmed}</div></div>`;
            });

            // Обработка блоков ```math\n...\n```
            html = html.replace(/```math\n([\s\S]*?)```/g, function(match, formula) {
                return `<div class="formula-block"><div class="formula-content">${formula.trim()}</div></div>`;
            });

            // Обработка блоков кода ```lang\n...\n```
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
                return `<pre class="code-block"><code>${code.trim()}</code></pre>`;
            });

            // Жирный текст **...**
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

            // Курсив *...*
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

            // Инлайн код `...`
            html = html.replace(/`(.+?)`/g, '<code class="inline-code">$1</code>');

            // Заголовки с эмодзи (📚, 🔍, ✅, и т.д.)
            html = html.replace(/^(📚|🔍|✅|📖|⚡|💡|📋|🔣)(.*)$/gm, function(match, emoji, rest) {
                return `<h2 class="section-header"><span class="header-emoji">${emoji}</span>${rest}</h2>`;
            });

            // Разделители
            html = html.replace(/^(---|===|\*\*\*)$/gm, '<hr class="divider">');

            // Переносы строк → параграфы
            const paragraphs = html.split(/\n\n+/);
            html = paragraphs.map(p => {
                p = p.trim();
                if (!p) return '';
                if (p.startsWith('<h2') || p.startsWith('<div') || p.startsWith('<pre') || p.startsWith('<hr')) {
                    return p;
                }
                // Одиночные переносы внутри параграфа
                p = p.replace(/\n/g, '<br>');
                return `<p>${p}</p>`;
            }).join('\n');

            content.innerHTML = html;

            // Рендер KaTeX формул
            if (window.renderMathInElement) {
                renderMathInElement(content, {
                    delimiters: [
                        {left: '$', right: '$', display: false},
                    ],
                    throwOnError: false,
                    trust: true,
                });
            }

            // Рендер формул в formula-block
            document.querySelectorAll('.formula-content').forEach(el => {
                try {
                    katex.render(el.textContent.trim(), el, {
                        displayMode: true,
                        throwOnError: false,
                        trust: true,
                    });
                } catch(e) {
                    // Если KaTeX не может отрендерить — оставляем как текст
                    el.classList.add('formula-fallback');
                }
            });
        });
    </script>
</body>
</html>
